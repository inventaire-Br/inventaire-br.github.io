<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Layout : application mobile d'abord — barre d'état en haut, une vue à la fois, onglets en bas (pouce). */
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#1b2128; --muted:#5d6874; --line:#d5dade;
  --accent:#f2b705; --accent-ink:#1b2128; --steel:#2f4a63;
  --ok:#1f8a4c; --warn:#b86e00; --bad:#c23a2b; --okbg:#e3f3ea; --warnbg:#fff2d6; --badbg:#fbe5e2;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161b; --surface:#1b2128; --ink:#e7eaee; --muted:#9aa6b2; --line:#2e3741;
  --accent:#f2b705; --accent-ink:#12161b; --steel:#8fb3d4;
  --ok:#4cc27f; --warn:#f0a63a; --bad:#ff7a69; --okbg:#173326; --warnbg:#3a2c12; --badbg:#3d1d19; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161b; --surface:#1b2128; --ink:#e7eaee; --muted:#9aa6b2; --line:#2e3741;
  --accent:#f2b705; --accent-ink:#12161b; --steel:#8fb3d4;
  --ok:#4cc27f; --warn:#f0a63a; --bad:#ff7a69; --okbg:#173326; --warnbg:#3a2c12; --badbg:#3d1d19; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);display:flex;flex-direction:column}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}

/* barre haute */
.top{background:var(--steel);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
:root[data-theme="dark"] .top{background:#1f3347}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#1f3347}}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;margin-right:auto}
.brand i{display:inline-block;width:14px;height:14px;background:repeating-linear-gradient(135deg,var(--accent) 0 4px,#1b2128 4px 8px);border-radius:3px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;max-width:100%}
.chip b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.chip.static{cursor:default}
.chip.need{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.wrap{max-width:980px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* onglets */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left}
.big strong{font-size:16px}
.big.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.big.primary .muted{color:inherit;opacity:.8}
.big svg{width:26px;height:26px}
label.big input{display:none}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;color:var(--ink);font-weight:400;font-size:15px}
textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)}
.pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.alert{border-left:4px solid var(--warn);background:var(--warnbg);padding:10px 12px;border-radius:6px;font-size:14px}
.alert.bad{border-color:var(--bad);background:var(--badbg)}
.alert.ok{border-color:var(--ok);background:var(--okbg)}
.alert.info{border-color:var(--steel);background:var(--bg)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;border-top:4px solid var(--line)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);font-weight:600}
.tile.bad{border-top-color:var(--bad)} .tile.warn{border-top-color:var(--warn)} .tile.ok{border-top-color:var(--ok)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600;color:var(--muted);white-space:nowrap;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}

.zone-card{display:flex;gap:12px;align-items:flex-start}
.zone-card .ph{display:flex;gap:4px;flex-wrap:wrap}
.zone-card.cur{outline:2px solid var(--accent)}

/* modale */
.modal{position:fixed;inset:0;background:rgba(10,14,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:760px){.modal{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:980px;max-height:94%;overflow:auto;border-radius:14px 14px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.sheet{border-radius:14px;max-height:90%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-16px;background:var(--surface);padding:4px 0 8px;border-bottom:1px solid var(--line);z-index:2}
.val{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.val{grid-template-columns:minmax(260px,1fr) 1.3fr}}
.val .pics{display:flex;flex-direction:column;gap:8px}
.val .pics img{width:100%;border-radius:8px;border:1px solid var(--line);background:#000;max-height:360px;object-fit:contain;cursor:zoom-in}
.val .pics img.zoom{max-height:none;cursor:zoom-out}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fld input.low{border-color:var(--warn);background:var(--warnbg)}
.fld input.missing{border-color:var(--bad)}
.fld .hint{font-weight:400;font-size:11px}
.fld{justify-content:flex-end}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.codes{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;word-break:break-all}
details summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.dlg{position:fixed;inset:0;background:rgba(10,14,18,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.dlg .box{background:var(--surface);border-radius:12px;padding:16px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.auth{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.auth .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px}
.auth .brand{color:var(--ink);font-size:20px}
td select{min-width:150px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:14px;max-width:90vw}
#toast div.bad{background:var(--bad);color:#fff}
.stripe{height:6px;background:repeating-linear-gradient(135deg,var(--accent) 0 10px,var(--ink) 10px 20px);border-radius:3px;opacity:.85}
.famrow{display:grid;grid-template-columns:1.4fr 1.6fr auto auto auto;gap:6px;align-items:center}
@media (max-width:600px){.famrow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Navigation">
  <button data-v="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>Scanner</button>
  <button data-v="zones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>Zones</button>
  <button data-v="liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Comptage</button>
  <button data-v="analyse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Analyse</button>
  <button data-v="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</button>
</nav>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="dlg" class="dlg hidden" role="alertdialog" aria-modal="true"><div class="box" id="dlgbox"></div></div>
<div id="toast" aria-live="polite"></div>
<div id="auth" class="auth"><div class="box"><div class="brand"><i></i>Inventaire Scan</div><div id="authBody"><div class="row"><div class="spinner"></div><span>Connexion…</span></div></div></div></div>

<script>
"use strict";
/* ================= utilitaires ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s??'').toUpperCase().replace(/[\s\-_.\/\\:]/g,'');
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'champ';
const fmtDate=iso=>{try{const d=new Date(iso);return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}catch{return ''}};
const LS={get(k,d){try{const v=localStorage.getItem('invscan_'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('invscan_'+k,JSON.stringify(v))}catch{}}};
function toast(msg,kind){const t=document.createElement('div');t.textContent=msg;if(kind)t.className=kind;$('#toast').appendChild(t);setTimeout(()=>t.remove(),4200)}
const loaded={};
function loadScript(src){return loaded[src]||(loaded[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error('Bibliothèque non chargée (connexion ?)'))};document.head.appendChild(s)}))}
const LIB={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  zxing:'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js'};

/* dialogue de confirmation (confirm() est bloqué) */
function ask(msg,ok='Confirmer',danger=false){return new Promise(res=>{const box=$('#dlgbox');box.innerHTML=`<div>${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="btn" id="dlgNo">Annuler</button><button class="btn ${danger?'danger':'primary'}" id="dlgOk">${esc(ok)}</button></div>`;$('#dlg').classList.remove('hidden');const done=v=>{$('#dlg').classList.add('hidden');res(v)};$('#dlgNo').onclick=()=>done(false);$('#dlgOk').onclick=()=>done(true);$('#dlgOk').focus()})}

/* ================= état ================= */
const S={mode:'local',db:null,user:null,uid:null,canEdit:false,isOwner:false,sample:null,aiImages:false,assets:null,downloads:null,
  families:[],zones:[],sessions:[],scans:[],roles:[],users:[],names:{},
  view:'scan',session:LS.get('session',null),zone:LS.get('zone',null),scanFamily:LS.get('scanFamily','auto'),enhance:LS.get('enhance',false),
  localRole:LS.get('localRole','admin'),localName:LS.get('localName',''),
  queue:[],qi:0,filters:{zone:'',fam:'',agent:'',q:'',alerts:false},theo:null,theoRaw:null,map:null,anaSession:null,loadNote:'',unsubs:[]};

const GENERIC={id:'generique',name:'Générique',order:99,
  fields:[{key:'reference',label:'Référence'},{key:'designation',label:'Désignation'},{key:'marque',label:'Marque'},{key:'gtin',label:'Code article (EAN / GTIN)'},{key:'lot',label:'N° de lot'},{key:'serie',label:'N° de série',unique:true},{key:'date_fab',label:'Date de fabrication'},{key:'date_exp',label:'Date de péremption'},{key:'poids_net',label:'Poids net / contenance'},{key:'qte_carton',label:'Nombre de pièces par carton',hints:['Contenu','pièces','PCS','Qté','x24','paires']}],
  questions:['Que voyez-vous écrit sur le produit ou le carton ?','Marque ou fabricant visible ?']};
const LIMITE=9000, SUPA={server:'Supabase',project:'anvzffkueynavskbpgna'};
const totalDocs=()=>S.scans.length;
function placeOk(n=1){const t=totalDocs();if(t+n>LIMITE){toast(`Limite de ${LIMITE} enregistrements atteinte (${t}). Prévenez l'administrateur : il faut exporter puis supprimer d'anciens comptages.`,'bad');return false}
  if(t+n>LIMITE*0.9&&!S.warned90){S.warned90=true;toast(`Attention : ${t} enregistrements sur ${LIMITE}. Pensez à envoyer et libérer les anciennes sessions.`)}return true}
const ROLES={compteur:'Compteur',magasinier:'Magasinier',gestionnaire:'Gestionnaire du stock',admin:'Administrateur'};
const MOVES={inventaire:'Inventaire (comptage)',entree:'Entrée en stock',sortie:'Sortie de stock',transfert:'Transfert'};

function families(){const f=[...S.families].sort((a,b)=>(a.order??50)-(b.order??50)||String(a.name).localeCompare(b.name));if(!f.some(x=>x.id==='generique'))f.push(GENERIC);return f}
const famById=id=>families().find(f=>f.id===id)||GENERIC;
const zoneById=id=>S.zones.find(z=>z.id===id);
const sessById=id=>S.sessions.find(s=>s.id===id);
function role(){if(S.mode==='supabase')return S.profil?.role||'compteur';if(S.mode==='local')return S.localRole;if(S.canEdit)return 'admin';const r=S.roles.find(r=>r.id===S.uid);return r?.role||'compteur'}
const canManage=()=>['admin','gestionnaire','magasinier'].includes(role());
const isAdmin=()=>role()==='admin';
function who(scan){if(scan.byName)return scan.byName;if(scan.by)return S.names[scan.by]||'Agent';return '—'}
const uniqueKeys=fam=>(fam.fields||[]).filter(f=>f.unique).map(f=>f.key);

/* ================= stockage ================= */
const COLS={families:'inv_families',zones:'inv_zones',sessions:'inv_sessions',scans:'inv_scans',roles:'inv_roles',users:'inv_users'};
const Store={
  local:{},
  loadLocal(){this.local=LS.get('local_v1',{})||{};for(const k in COLS)S[k]=Object.values(this.local[k]||{})},
  saveLocal(){try{localStorage.setItem('invscan_local_v1',JSON.stringify(this.local))}catch(e){toast('Mémoire locale pleine : exportez une sauvegarde puis supprimez des comptages.','bad')}},
  subscribe(){
    for(const [k,col] of Object.entries(COLS)){
      let t=setTimeout(()=>{S.loadNote='Les données partagées ne répondent pas encore. Vérifiez la connexion Internet.';scheduleRender()},10000);
      const un=S.db.collection(col).onSnapshot(snap=>{
        if(!snap.metadata.fromCache&&t){clearTimeout(t);t=null;if(S.loadNote){S.loadNote='';}}
        S[k]=snap.docs.map(d=>({id:d.id,...d.data()}));
        if(k==='scans'||k==='users')resolveNames();
        if(k==='sessions'&&(!snap.metadata.fromCache||snap.size))pickDefaultSession();
        scheduleRender();
      },err=>{if(t)clearTimeout(t);console.warn(col,err);if(err.code==='revoked'){S.loadNote='Accès aux données partagées retiré.';scheduleRender()}});
      S.unsubs.push(un);
    }
  },
  async put(k,obj){
    if(S.mode==='supabase')return SBStore.put(k,obj);
    const id=obj.id||uid();const body={...obj};delete body.id;
    if(S.db){
      try{await S.db.collection(COLS[k]).doc(id).set(body)}
      catch(e){if(e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*800));await S.db.collection(COLS[k]).doc(id).set(body)}
        else{throw e}}
    }else{(this.local[k]||(this.local[k]={}))[id]={id,...body};this.saveLocal();S[k]=Object.values(this.local[k]);scheduleRender()}
    return id;
  },

function byAgent(list){const m={};for(const s of list){const k=agentKey(s);const a=m[k]||(m[k]={k,nom:who(s),scans:0,pieces:0,zones:new Set(),alertes:0,premier:s.at,dernier:s.at});a.scans++;a.pieces+=pieces(s);a.zones.add(zoneById(s.zoneId)?.code||zoneById(s.zoneId)?.name||'?');if((s.flags||[]).some(f=>f!=='sans_etiquette'))a.alertes++;if(String(s.at)<String(a.premier))a.premier=s.at;if(String(s.at)>String(a.dernier))a.dernier=s.at}return Object.values(m).sort((a,b)=>b.pieces-a.pieces)}
function filteredScans(){const F=S.filters,q=norm(F.q);return scansOf(S.session).filter(s=>(!F.zone||s.zoneId===F.zone)&&(!F.agent||agentKey(s)===F.agent)&&(!F.fam||s.familyId===F.fam)&&(!F.alerts||(s.flags||[]).some(f=>f!=='sans_etiquette'))&&(!q||norm(Object.values(s.fields||{}).join(' ')+' '+(s.note||'')).includes(q))).sort((a,b)=>String(b.at).localeCompare(String(a.at)))}

async function loadBitmap(file){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch{return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Image illisible'));i.src=URL.createObjectURL(file)})}}
function scaled(src,max){const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
const toBlob=(c,q=.85)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
function enhanced(src){const c=scaled(src,src.width);const x=c.getContext('2d');const d=x.getImageData(0,0,c.width,c.height),a=d.data,h=new Uint32Array(256);
  for(let i=0;i<a.length;i+=4){const g=(a[i]*.299+a[i+1]*.587+a[i+2]*.114)|0;a[i]=g;h[g]++}
  const n=a.length/4;let lo=0,hi=255,acc=0;for(let i=0;i<256;i++){acc+=h[i];if(acc>n*.01){lo=i;break}}acc=0;for(let i=255;i>=0;i--){acc+=h[i];if(acc>n*.01){hi=i;break}}
  const k=255/Math.max(1,hi-lo);for(let i=0;i<a.length;i+=4){const v=Math.max(0,Math.min(255,(a[i]-lo)*k));a[i]=a[i+1]=a[i+2]=v}
  x.putImageData(d,0,0);return c}
async function prepImage(file){
  const bmp=await loadBitmap(file);const big=scaled(bmp,1600);const th=scaled(bmp,360);
  const out={big,blob:await toBlob(big,.85),aiBlob:await toBlob(scaled(bmp,1280),.75),thumb:th.toDataURL('image/jpeg',.6),preview:URL.createObjectURL(file)};
  if(S.enhance){out.enh=enhanced(big);out.enhBlob=await toBlob(out.enh,.9)}
  out.hash=await photoHash(file,bmp);
  return out;
}
async function photoHash(file,bmp){
  let sha='';try{const b=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());sha=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{}
  const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d');x.drawImage(bmp,0,0,9,8);const a=x.getImageData(0,0,9,8).data;let bits='';
  for(let y=0;y<8;y++)for(let i=0;i<8;i++){const p=(y*9+i)*4,q=p+4;bits+=(a[p]*.299+a[p+1]*.587+a[p+2]*.114)>(a[q]*.299+a[q+1]*.587+a[q+2]*.114)?'1':'0'}
  let dh='';for(let i=0;i<64;i+=4)dh+=parseInt(bits.slice(i,i+4),2).toString(16);
  return {sha,dh};
}
const hamming=(a,b)=>{if(!a||!b||a.length!==b.length)return 99;let n=0;for(let i=0;i<a.length;i++){let v=parseInt(a[i],16)^parseInt(b[i],16);while(v){n+=v&1;v>>=1}}return n};
const samePhoto=(p,q)=>(p.sha&&p.sha===q.sha)||hamming(p.dh,q.dh)<=4;

/* ================= codes-barres / QR ================= */
async function readCodes(canvas){
  const out=[];
  try{if('BarcodeDetector' in window){const det=new BarcodeDetector();const r=await det.detect(canvas);r.forEach(x=>out.push({format:x.format,value:x.rawValue}))}}catch{}
  if(!out.length){try{await loadScript(LIB.zxing);const Z=window.ZXing;for(const B of [Z.HybridBinarizer,Z.GlobalHistogramBinarizer]){try{const lum=new Z.HTMLCanvasElementLuminanceSource(canvas);const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);const rd=new Z.MultiFormatReader();rd.setHints(hints);const res=rd.decode(new Z.BinaryBitmap(new B(lum)));out.push({format:String(Z.BarcodeFormat[res.getBarcodeFormat()]||'code'),value:res.getText()});break}catch{}}}catch{}}
  return out;
}
/* lecture GS1 : (01) GTIN, (10) lot, (11) date fab., (17) péremption, (21) série */
function parseGS1(v){
  const o={};let s=String(v||'').replace(/^\](C1|d2|Q3|e0)/,'');
  if(/\(\d{2,4}\)/.test(s)){const re=/\((\d{2,4})\)([^(]*)/g;let m;while((m=re.exec(s)))o[m[1]]=m[2].trim()}
  else if(/^(01\d{14}|10|21|11\d{6})/.test(s)&&(s.includes('\x1d')||/^01\d{14}/.test(s))){
    const fixed={'00':18,'01':14,'02':14,'11':6,'13':6,'15':6,'17':6};let i=0,guard=0;
    while(i<s.length&&guard++<12){const ai=s.substr(i,2);if(fixed[ai]){o[ai]=s.substr(i+2,fixed[ai]);i+=2+fixed[ai];if(s[i]==='\x1d')i++}
      else if(ai==='10'||ai==='21'){let j=s.indexOf('\x1d',i+2);if(j<0)j=s.length;o[ai]=s.slice(i+2,j);i=j+1}else break}
  }
  const d=x=>x&&/^\d{6}$/.test(x)?`20${x.slice(0,2)}-${x.slice(2,4)}-${x.slice(4,6)}`:x;
  const r={};if(o['10'])r.lot=o['10'];if(o['21'])r.serie=o['21'];if(o['11'])r.date_fab=d(o['11']);if(o['01'])r.gtin=o['01'];if(o['17'])r.date_exp=d(o['17']);
  if(!Object.keys(o).length&&/^\d{8}$|^\d{12,14}$/.test(s.replace(/\s/g,'')))r.gtin=s.replace(/\s/g,''); // EAN-8/13, UPC, GTIN-14 : code article
  return r;
}
const isGtin=v=>/^\d{8}$|^\d{12,14}$/.test(String(v||'').replace(/\s/g,''));
const NC_RE=/\bNC\b|non.?conforme|quarantaine|rebut|bloqu|d[ée]fectueu|hors.?service|à.?d[ée]truire/i;
const num=v=>{const n=parseFloat(String(v??'').replace(/[^\d,.\-]/g,'').replace(',','.'));return isNaN(n)?null:n};
function pieces(s){const fam=famById(s.familyId);if(s.unit==='carton'){const pc=num((s.fields||{}).qte_carton);return pc?(+s.qty||0)*pc:(+s.qty||0)}return +s.qty||0}
const qtyTxt=s=>s.unit==='carton'?`${s.qty??1} carton(s) = ${pieces(s)} pcs`:String(s.qty??1);
const hasCarton=fam=>(fam.fields||[]).some(f=>f.key==='qte_carton');

/* ================= lecture IA ================= */
function parseJSON(t){if(t&&typeof t==='object')return t;const s=String(t||'');const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)throw new Error('Réponse IA illisible');return JSON.parse(s.slice(a,b+1))}
const AI_MAX_MS=5000; // délai maximum d'attente de la lecture IA
async function aiExtract({blobs,family,codes,answers,noLabel}){
  if(!S.sample)return null;
  const fams=family?[family]:families();
  const famTxt=fams.map(f=>({id:f.id,nom:f.name,champs:(f.fields||[]).map(x=>({cle:x.key,libelle:x.label,indices:x.hints||undefined}))}));
  const prompt=`Tu aides un agent d'inventaire dans un magasin industriel. ${noLabel?"Le produit n'a PAS de plaque signalétique ni d'étiquette : les photos montrent le produit lui-même ou son carton/emballage (marquages imprimés, gravés, peints, inscriptions sur la gaine d'un câble, numéro sur la joue d'un touret, etc.).":"Les photos montrent une plaque signalétique ou une étiquette de produit."}
Le texte peut être dans n'importe quelle langue (français, anglais, arabe, chinois, etc.) et la plaque peut être gravée, en relief ou sur du métal réfléchissant.
${family?'Famille imposée':'Familles possibles'} (JSON) : ${JSON.stringify(famTxt)}
Codes-barres / QR déjà décodés : ${codes.length?JSON.stringify(codes.map(c=>c.value)):'aucun'}
${answers&&Object.keys(answers).length?'Réponses de l\'agent sur le terrain : '+JSON.stringify(answers):''}
Consignes :
1. ${family?'Utilise la famille imposée.':'Choisis la famille la plus adaptée (son id).'}
2. Remplis chaque champ de cette famille avec la valeur lue. N'invente jamais : mets null si absent ou illisible.
3. Recopie les numéros (lot, série, référence) exactement, caractère par caractère, sans traduire. Garde les unités (ex. "18 W", "220-240 V~", "1,2 kg").
4. Dates au format AAAA-MM-JJ si possible, sinon telles qu'écrites.
5. Donne une confiance de 0 à 1 par champ. Si un caractère est douteux (0/O, 1/I/l, 5/S, 8/B, 2/Z, 6/9), baisse la confiance sous 0,6.
6. Le texte peut être à l'envers, de travers ou en miroir (photo retournée, marquage peint sur un touret) : lis-le dans le bon sens.
7. Recopie dans "codes_lus" les chiffres imprimés sous les codes-barres (ex. "6136195000069", "(01)16132355606086"). Un code EAN/GTIN identifie l'article, ce n'est jamais un n° de série.
8. Si tu vois un autocollant ou un marquage d'état (NC, non conforme, quarantaine, rebut, bloqué, OK…), décris-le dans "etat", même s'il contredit l'étiquette.
9. Plusieurs photos peuvent montrer des faces différentes du même produit : combine-les en une seule fiche.
${family?'':'10. Si aucune famille ne convient vraiment, choisis "generique" et propose dans "famille_suggeree" un nom de famille et ses champs utiles.'}
Réponds UNIQUEMENT avec ce JSON :
{"famille_id":"…","champs":{"cle":"valeur ou null"},"confiance":{"cle":0.0},"codes_lus":[],"etat":"","texte_lu":"transcription courte du texte visible","remarques":"problèmes de lecture éventuels, en français, ou chaîne vide"${family?'':',"famille_suggeree":null ou {"nom":"…","champs":["…"]}'}}`;
  const opts={modelTier:'default'};
  if(blobs.length&&S.aiImages)opts.images=blobs.slice(0,6);
  try{const r=await Promise.race([S.sample(prompt,opts),new Promise((_,ko)=>setTimeout(()=>ko({code:'timeout'}),AI_MAX_MS))]);return parseJSON(r.text)}
  catch(e){if(e?.code==='not_granted'){S.sample=null;renderTop()}else if(e?.code==='timeout'||e?.code==='TIMEOUT')toast('IA trop lente (plus de 5 s) : complétez à la main ou relancez la lecture.','bad');else if(e?.code==='rate_limited')toast('IA momentanément saturée, saisissez à la main ou relancez dans un instant.','bad');else toast('Lecture IA impossible : '+(e?.message||e),'bad');return null}
}

/* ================= file de scan + validation ================= */
function startQueue(files){S.queue=files;S.qi=0;nextInQueue()}
function nextInQueue(){if(S.qi>=S.queue.length){const n=S.queue.length;S.queue=[];closeModal();if(n>1)toast(`Lot terminé : ${n} photos traitées`);render();return}
  openValidation({files:[S.queue[S.qi]],idx:S.qi+1,total:S.queue.length})}

async function analyse(ctx){
  const imgs=[];for(const f of ctx.files||[]){try{imgs.push(await prepImage(f))}catch(e){toast(e.message,'bad')}}
  const fixed=ctx.familyId&&ctx.familyId!=='auto'?famById(ctx.familyId):(S.scanFamily!=='auto'?famById(S.scanFamily):null);
  // lecture des codes-barres et lecture IA en parallèle (IA : une image réduite par photo, réponse en 5 s max)
  const codesP=(async()=>{const codes=[];for(const im of imgs){(await readCodes(im.big)).forEach(c=>codes.push(c));if(im.enh&&!codes.length)(await readCodes(im.enh)).forEach(c=>codes.push(c))}return codes})();
  const blobs=imgs.map(im=>im.aiBlob||im.blob);
  const [codes,ai]=await Promise.all([codesP,aiExtract({blobs,family:fixed,codes:[],answers:ctx.answers,noLabel:ctx.noLabel})]);
  const gs={};codes.forEach(c=>Object.assign(gs,parseGS1(c.value)));
  let fam=fixed||(ai?.famille_id?famById(ai.famille_id):null)||GENERIC;
  const fields={},conf={};
  for(const fd of fam.fields||[]){const v=ai?.champs?.[fd.key];if(v!=null&&String(v).trim()!==''&&String(v).toLowerCase()!=='null'){fields[fd.key]=String(v).trim();conf[fd.key]=+(ai?.confiance?.[fd.key]??.7)}}
  for(const v of (Array.isArray(ai?.codes_lus)?ai.codes_lus:[])){const val=String(v).trim();if(val&&!codes.some(c=>norm(c.value)===norm(val))){codes.push({format:'lu sur la photo',value:val});Object.assign(gs,{...parseGS1(val),...gs})}}
  for(const k of ['lot','serie','date_fab','date_exp','gtin'])if(gs[k]&&(fam.fields||[]).some(f=>f.key===k)&&!fields[k]){fields[k]=gs[k];conf[k]=Math.max(conf[k]||0,.9)}
  for(const k of uniqueKeys(fam))if(isGtin(fields[k])&&gs.gtin&&norm(fields[k])===norm(gs.gtin)){delete fields[k]} // un EAN n'est pas un n° de série
  if(!ai&&codes.length===1&&!Object.keys(gs).length){const uk=uniqueKeys(fam)[0];if(uk&&!fields[uk]){fields[uk]=codes[0].value;conf[uk]=.5}}
  const etat=String(ai?.etat||'').trim();
  return {familyId:fam.id,fields,conf,qty:1,unit:'piece',codes,raw:ai?.texte_lu||'',remark:ai?.remarques||'',imgs,answers:ctx.answers||null,noLabel:!!ctx.noLabel,gtin:gs.gtin||null,usedAI:!!ai,
    etat,suggest:(fam.id==='generique'&&ai?.famille_suggeree&&ai.famille_suggeree.nom)?ai.famille_suggeree:null};
}

function dupCheck(d,excludeId){
  const fam=famById(d.familyId),msgs=[],flags=new Set(),block=[];
  const others=S.scans.filter(s=>s.sessionId===S.session&&s.id!==excludeId);
  const mine=(d.imgs||[]).map(im=>im.hash).filter(Boolean).concat(d.photos||[]);
  if(mine.length){const hit=others.find(s=>(s.photos||[]).some(p=>mine.some(m=>samePhoto(m,p))));
    if(hit){const z=zoneById(hit.zoneId);flags.add('meme_photo');block.push(hit);msgs.push(`<b>Photo déjà enregistrée</b> le ${esc(fmtDate(hit.at))} par ${esc(who(hit))}, zone ${esc(z?.code||z?.name||'?')} (qté ${esc(qtyTxt(hit))}).`)}}
  const idKeys=[...new Set([...uniqueKeys(fam),...(fam.fields||[]).filter(f=>f.key==='lot'||f.key==='serie').map(f=>f.key)])];
  for(const k of idKeys){const v=norm(d.fields[k]);if(!v)continue;
    const hits=others.filter(s=>norm((s.fields||{})[k])===v);
    const lbl=(fam.fields.find(f=>f.key===k)||{}).label||k;const byZ={};hits.forEach(x=>(byZ[x.zoneId]||(byZ[x.zoneId]=[])).push(x));
    for(const [zid,l] of Object.entries(byZ)){const z=zoneById(zid),last=l[l.length-1],n=l.length>1?` (${l.length} fois)`:'';
      if(zid===(d.zoneId||S.zone)){flags.add('doublon');if(!block.includes(last))block.push(last);msgs.push(`<b>Déjà enregistré :</b> ${esc(lbl)} « ${esc(d.fields[k])} » déjà compté dans cette zone${n}, le ${esc(fmtDate(last.at))} par ${esc(who(last))} (qté ${esc(qtyTxt(last))}).`)}
      else{flags.add('autre_zone');msgs.push(`<b>Emplacement différent :</b> ${esc(lbl)} « ${esc(d.fields[k])} » déjà compté dans la zone ${esc(z?.code||z?.name||'?')}${n}, le ${esc(fmtDate(last.at))}.`)}}}
  const missing=(fam.fields||[]).filter(f=>f.required&&!String(d.fields[f.key]||'').trim()).map(f=>f.label);
  if(missing.length)flags.add('incomplet');
  if(d.etat&&NC_RE.test(d.etat))flags.add('non_conforme');
  return {flags:[...flags],msgs,missing,block};
}

async function saveScan(d,r){
  if(!d.editId&&!placeOk(1))throw {code:'limite',message:'limite atteinte'};
  const fam=famById(d.familyId);const fields={};for(const f of fam.fields||[])if(d.fields[f.key])fields[f.key]=d.fields[f.key];
  const flags=[...r.flags];if(d.noLabel)flags.push('sans_etiquette');
  let assetIds=d.assetIds||[];
  if(S.assets&&d.imgs.length){for(const im of d.imgs){try{const a=await S.assets.upload(im.blob);assetIds.push(a.id)}catch{}}}
  const base=d.editId?(S.scans.find(s=>s.id===d.editId)||{}):{};
  const doc={...base,id:d.editId||undefined,sessionId:base.sessionId||S.session,zoneId:base.zoneId||S.zone,familyId:fam.id,fields,qty:d.qty,unit:hasCarton(fam)?(d.unit||'piece'):'piece',etat:d.etat||'',note:d.note||'',
    codes:(d.codes||[]).slice(0,5),raw:String(d.raw||'').slice(0,1500),answers:d.answers||null,noLabel:!!d.noLabel,flags,gtin:d.gtin||null,
    thumb:d.imgs[0]?.thumb||d.thumb||null,assetIds,photos:[...(base.photos||[]),...d.imgs.map(im=>im.hash).filter(Boolean)].slice(0,6),
    at:base.at||new Date().toISOString(),by:base.by||S.uid||null,byName:base.byName||(S.mode==='local'?(S.localName||'Moi'):null)};
  doc.pieces=pieces(doc);
  if(d.editId)doc.editedAt=new Date().toISOString();
  if(!doc.id)delete doc.id;
  await Store.put('scans',doc);
}

/* ================= Analyse ================= */
const TARGETS=[['ref','Référence',['ref','réf','code','article','item','sku','part']],['des','Désignation',['désign','design','libell','descr','produit','intitul','name']],['serie','N° lot / série',['série','serie','serial','lot','s/n','sn','batch','numéro']],['emp','Emplacement / zone',['emplac','zone','location','magasin','dépôt','depot','rayon','casier','allée','allee']],['qte','Quantité',['qt','quant','stock','qty','dispo','nombre']]];
function guessMap(rows){
  let hi=0,best=-1;for(let r=0;r<Math.min(rows.length,20);r++){const cells=rows[r].map(c=>String(c).toLowerCase());let sc=0;for(const [,,kw] of TARGETS)if(cells.some(c=>kw.some(k=>c.includes(k))))sc++;if(sc>best){best=sc;hi=r}}
  const head=(rows[hi]||[]).map(c=>String(c).toLowerCase());const m={header:hi};
  for(const [k,,kw] of TARGETS){m[k]=head.findIndex(c=>kw.some(x=>c.includes(x)))}
  return m;
}
function applyMap(){const rows=S.theoRaw||[],m=S.map;if(!rows.length||!m){S.theo=null;return}
  const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n};
  S.theo=rows.slice(m.header+1).map(r=>({ref:m.ref>=0?String(r[m.ref]??'').trim():'',des:m.des>=0?String(r[m.des]??'').trim():'',serie:m.serie>=0?String(r[m.serie]??'').trim():'',emp:m.emp>=0?String(r[m.emp]??'').trim():'',qte:m.qte>=0?num(r[m.qte]):1}))
    .filter(x=>x.ref||x.serie||x.des);
}
async function readTheoFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.pdf')){await loadScript(LIB.pdfw);await loadScript(LIB.pdf);const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const rows=[],raw=[];
    for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();const lines={};
      for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]/3)*3;(lines[y]||(lines[y]=[])).push({x:it.transform[4],w:it.width,s:it.str})}
      Object.keys(lines).map(Number).sort((a,b)=>b-a).forEach(y=>{const its=lines[y].sort((a,b)=>a.x-b.x);const cells=[];let cur=null,end=null;
        for(const it of its){if(cur&&end!=null&&it.x-end<=7){cur.s+=(it.x-end>1?' ':'')+it.s}else{cur={x:it.x,s:it.s};cells.push(cur)}end=it.x+it.w}
        raw.push(cells.map(c=>({x:c.x,s:c.s.trim()})))})}
    // alignement des cellules sur les colonnes de l'en-tête (une cellule vide ne décale pas les suivantes)
    const hi=guessMap(raw.map(r=>r.map(c=>c.s))).header;const hx=(raw[hi]||[]).map(c=>c.x);
    for(let i=0;i<raw.length;i++){if(i<=hi||!hx.length){rows.push(raw[i].map(c=>c.s));continue}
      const r=new Array(hx.length).fill('');for(const c of raw[i]){let j=0;for(let k=0;k<hx.length;k++)if(hx[k]<=c.x+8)j=k;r[j]=r[j]?r[j]+' '+c.s:c.s}rows.push(r)}
    return {rows,text:rows.map(r=>r.join(' | ')).join('\n')};
  }
  await loadScript(LIB.xlsx);const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});return {rows,text:''};
}
async function aiTheo(text){
  const prompt=`Voici le texte extrait d'un état de stock (PDF), une ligne par ligne de tableau, colonnes séparées par « | ».
Extrait chaque article en stock. N'invente rien. Réponds UNIQUEMENT en JSON : {"lignes":[{"reference":"","designation":"","lot_serie":"","emplacement":"","quantite":0}]}
Texte :
${text.slice(0,60000)}`;
  const r=await S.sample(prompt,{modelTier:'default'});const j=parseJSON(r.text);
  return (j.lignes||[]).map(l=>({ref:String(l.reference||''),des:String(l.designation||''),serie:String(l.lot_serie||''),emp:String(l.emplacement||''),qte:+l.quantite||0}));
}
function computeAnalysis(sessId){
  const scans=scansOf(sessId);const zn=id=>{const z=zoneById(id);return z?.code||z?.name||'?'};
  const theoSer=new Map(),theoRef=new Map();for(const t of (S.theo||[])){const n=norm(t.serie);if(n)theoSer.set(n,t);const r=norm(t.ref);if(r)theoRef.set(r,t)}
  const matchTheo=s=>{for(const v of Object.values(s.fields||{})){const n=norm(v);if(n.length>=3&&theoSer.has(n))return theoSer.get(n)}for(const v of [s.fields?.reference,s.fields?.gtin,s.gtin]){const n=norm(v);if(n&&theoRef.has(n))return theoRef.get(n)}return null};
  const keyRef=s=>{const t=matchTheo(s);if(t)return norm(t.ref||t.des);return norm(s.fields?.reference||s.fields?.gtin||s.gtin||s.fields?.designation||'')};
  const seenU=new Set();const counted={};for(const s of scans){const u=uniqueKeys(famById(s.familyId)).map(k=>norm(s.fields?.[k])).find(Boolean);if(u){if(seenU.has(u))continue;seenU.add(u)} // un même n° de série n'est compté qu'une fois
    const k=keyRef(s)||'(SANS RÉFÉRENCE)';const c=counted[k]||(counted[k]={ref:s.fields?.reference||s.fields?.gtin||s.gtin||'',des:s.fields?.designation||'',qty:0,zones:new Set(),n:0});c.qty+=pieces(s);c.n++;c.zones.add(zn(s.zoneId));if(!c.des&&s.fields?.designation)c.des=s.fields.designation}
  const ids={};for(const s of scans){const fam=famById(s.familyId);for(const k of uniqueKeys(fam)){const v=norm(s.fields?.[k]);if(!v)continue;(ids[v]||(ids[v]={val:s.fields[k],list:[]})).list.push(s)}}
  const doublons=[],multi=[];
  for(const v of Object.values(ids)){if(v.list.length<2)continue;const byZone={};v.list.forEach(s=>(byZone[s.zoneId]||(byZone[s.zoneId]=[])).push(s));
    for(const [z,l] of Object.entries(byZone))if(l.length>1)doublons.push({val:v.val,zone:zn(z),n:l.length,ref:l[0].fields?.reference||l[0].fields?.designation||famById(l[0].familyId).name,who:[...new Set(l.map(who))].join(', ')});
    if(Object.keys(byZone).length>1)multi.push({val:v.val,zones:Object.keys(byZone).map(zn).join(' · '),n:v.list.length,ref:v.list[0].fields?.reference||v.list[0].fields?.designation||famById(v.list[0].familyId).name})}
  const nc=scans.filter(s=>(s.flags||[]).includes('non_conforme')).map(s=>({ref:s.fields?.reference||s.fields?.designation||'',id:uniqueKeys(famById(s.familyId)).map(k=>s.fields?.[k]).find(Boolean)||s.fields?.lot||'',etat:s.etat||'',zone:zn(s.zoneId),qty:pieces(s)}));
  const res={scans:scans.length,counted,doublons,multi,nc,ecarts:[],notFound:[],unexpected:[],wrongPlace:[]};
  if(S.theo&&S.theo.length){
    const th={};for(const t of S.theo){const k=norm(t.ref||t.des);if(!k)continue;const c=th[k]||(th[k]={ref:t.ref,des:t.des,qty:0});c.qty+=t.qte}
    const keys=new Set([...Object.keys(th),...Object.keys(counted)]);
    for(const k of keys){const t=th[k],c=counted[k];const tq=t?.qty||0,cq=c?.qty||0;
      res.ecarts.push({ref:t?.ref||c?.ref||(k==='(SANS RÉFÉRENCE)'?k:'—'),des:t?.des||c?.des||'',theo:tq,compte:cq,ecart:cq-tq,statut:!t?'Non référencé au stock':!c?'Non trouvé':cq===tq?'Conforme':cq<tq?'Manquant':'Excédent'})}
    res.ecarts.sort((a,b)=>Math.abs(b.ecart)-Math.abs(a.ecart));
    const scanVals=new Map();for(const s of scans)for(const [,v] of Object.entries(s.fields||{})){const n=norm(v);if(n.length>=3)(scanVals.get(n)||scanVals.set(n,[]).get(n)).push(s)}
    const inZone=(s,emp)=>{const z=zoneById(s.zoneId),e=norm(emp);return [norm(z?.code),norm(z?.name)].some(x=>x&&(x===e||x.includes(e)||e.includes(x)))};
    for(const [n,t] of theoSer){const l=scanVals.get(n);if(!l)res.notFound.push(t);else if(t.emp&&!l.some(s=>inZone(s,t.emp)))res.wrongPlace.push({serie:t.serie,ref:t.ref,attendu:t.emp,trouve:[...new Set(l.map(s=>zn(s.zoneId)))].join(' · ')})}
    if(theoSer.size){for(const [v,o] of Object.entries(ids)){if(!theoSer.has(v))res.unexpected.push({val:o.val,ref:o.list[0].fields?.reference||'',zone:zn(o.list[0].zoneId)})}}
  }
  return res;
}
VIEWS.analyse=()=>{
  if(!canManage())return `<div class="card"><h2>Analyse réservée</h2><p class="muted">Cette fenêtre est réservée aux magasiniers, gestionnaires du stock et administrateurs.</p></div>`;
  const sid=S.anaSession||S.session;const sessOpts=S.sessions.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).map(s=>`<option value="${esc(s.id)}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('');
  if(!sid)return `<div class="card"><p>Aucune session à analyser.</p></div>`;
  const A=computeAnalysis(sid);const m=S.map;const cols=S.theoRaw?Math.max(...S.theoRaw.slice(0,30).map(r=>r.length)):0;
  const head=S.theoRaw&&m?S.theoRaw[m.header]||[]:[];
  const colOpt=sel=>`<option value="-1">— aucune —</option>`+Array.from({length:cols},(_,i)=>`<option value="${i}" ${sel===i?'selected':''}>Col. ${i+1}${head[i]?' : '+esc(String(head[i]).slice(0,24)):''}</option>`).join('');
  const T=(cls,v,l)=>`<div class="tile ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const nE=A.ecarts.filter(e=>e.statut!=='Conforme').length;
  const table=(heads,rows)=>`<div class="tbl-wrap"><table><thead><tr>${heads.map(h=>`<th class="${h[1]||''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${heads.length}" class="muted">Rien à signaler.</td></tr>`}</tbody></table></div>`;
  return `<div class="card"><div class="grid2"><label class="f">Session analysée<select id="aSess">${sessOpts}</select></label>
     <label class="f">Stock théorique (PDF, Excel ou CSV)<input type="file" id="aFile" accept=".pdf,.xlsx,.xls,.csv"></label></div>
     ${S.theoRaw?`<div class="small muted">${S.theoName?esc(S.theoName)+' · ':''}${S.theo?S.theo.length:0} ligne(s) de stock retenue(s)</div>
       ${S.theoRaw.length&&!S.theoAI?`<details ${S.theo&&S.theo.length?'':'open'}><summary>Colonnes du fichier</summary><div class="grid2" style="margin-top:8px">
       <label class="f">Ligne d'en-tête<input type="number" id="mH" min="1" value="${m.header+1}"></label>
       ${TARGETS.map(([k,l])=>`<label class="f">${l}<select data-m="${k}">${colOpt(m[k])}</select></label>`).join('')}</div></details>`:''}
       ${S.sample&&S.theoText?`<div><button class="btn sm" id="aAI">${S.theoAI?'Relire le PDF avec l\'IA':'Le PDF est mal découpé ? Le lire avec l\'IA'}</button></div>`:''}`
     :'<div class="small muted">Sans stock théorique, l\'analyse montre déjà les doublons et les n° de série vus dans plusieurs zones.</div>'}
     <div class="row"><button class="btn sm" id="aXls">Exporter l'analyse en Excel</button></div></div>
   <div class="tiles">${T('',A.scans,'Scans de la session')}${T(A.doublons.length?'bad':'ok',A.doublons.length,'Doublons')}${T(A.multi.length?'warn':'ok',A.multi.length,'Même n° série, zones différentes')}${T(A.nc.length?'bad':'ok',A.nc.length,'Produits non conformes')}
     ${S.theo?T(nE?'warn':'ok',nE,'Références en écart')+T(A.notFound.length?'bad':'ok',A.notFound.length,'N° attendus non trouvés')+T(A.unexpected.length?'warn':'ok',A.unexpected.length,'N° trouvés non attendus')+T(A.wrongPlace.length?'warn':'ok',A.wrongPlace.length,'Emplacement différent du stock'):''}</div>
   <h3>Doublons (même n° unique compté plusieurs fois dans la même zone)</h3>
   ${table([['N° série'],['Référence'],['Zone'],['Nb','num'],['Compté par']],A.doublons.map(d=>`<tr><td class="mono">${esc(d.val)}</td><td class="mono">${esc(d.ref)}</td><td>${esc(d.zone)}</td><td class="num">${d.n}</td><td>${esc(d.who)}</td></tr>`).join(''))}
   <h3>Même n° de série dans des emplacements différents</h3>
   ${table([['N° série'],['Référence'],['Zones'],['Nb','num']],A.multi.map(d=>`<tr><td class="mono">${esc(d.val)}</td><td class="mono">${esc(d.ref)}</td><td>${esc(d.zones)}</td><td class="num">${d.n}</td></tr>`).join(''))}
   <h3>Produits marqués non conformes</h3>

async function saveFile(filename,blob){
  if(S.downloads){try{await S.downloads.save({filename,data:blob});return}catch(e){try{await S.downloads.save({filename,data:new Uint8Array(await blob.arrayBuffer())});return}catch(e2){if(e2?.code==='rejected'||e2?.code==='cancelled')return;toast('Téléchargement refusé : '+(e2?.message||e2),'bad');return}}}
  toast('Le téléchargement n\'est pas disponible dans cet affichage. Ouvrez l\'application dans son propre onglet.','bad');
}
async function xlsxBlob(sheets){await loadScript(LIB.xlsx);const wb=XLSX.utils.book_new();for(const [name,rows] of sheets){const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{Info:'Aucune donnée'}]);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))}
  return new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function scanRow(s){const fam=famById(s.familyId),z=zoneById(s.zoneId);const r={Famille:fam.name,Zone:z?.code||z?.name||'',Quantité:s.qty??1,Unité:s.unit==='carton'?'carton':'pièce',Pièces:pieces(s),'Code article (GTIN)':s.gtin||''};for(const f of fam.fields||[])r[f.label]=s.fields?.[f.key]||'';
  Object.assign(r,{Alertes:(s.flags||[]).join(', '),État:s.etat||'',Remarque:s.note||'',Agent:who(s),Date:fmtDate(s.at),Codes:(s.codes||[]).map(c=>c.value).join(' ; ')});return r}
async function exportScans(){const sess=sessById(S.session);const list=scansOf(S.session);const sheets=[['Tous',list.map(scanRow)],['Par agent',byAgent(list).map(a=>({Agent:a.nom,Scans:a.scans,Pièces:a.pieces,Zones:[...a.zones].join(', '),Alertes:a.alertes,'Premier scan':fmtDate(a.premier),'Dernier scan':fmtDate(a.dernier)}))]];
  for(const f of families()){const l=list.filter(s=>s.familyId===f.id);if(l.length)sheets.push([f.name,l.map(scanRow)])}
  try{await saveFile(`Comptage_${slug(sess?.name||'session')}.xlsx`,await xlsxBlob(sheets))}catch(e){toast(e.message,'bad')}}
async function exportAnalysis(){const sid=S.anaSession||S.session;const A=computeAnalysis(sid);
  const sheets=[['Doublons',A.doublons.map(d=>({'N° série':d.val,Référence:d.ref,Zone:d.zone,Nombre:d.n,'Compté par':d.who}))],['Zones différentes',A.multi.map(d=>({'N° série':d.val,Référence:d.ref,Zones:d.zones,Nombre:d.n}))],['Non conformes',A.nc.map(n=>({Référence:n.ref,'N° lot/série':n.id,État:n.etat,Zone:n.zone,Pièces:n.qty}))]];
  if(S.theo){sheets.push(['Écarts',A.ecarts.map(e=>({Référence:e.ref,Désignation:e.des,Théorique:e.theo,Compté:e.compte,Écart:e.ecart,Statut:e.statut}))],['Non trouvés',A.notFound.map(t=>({'N° lot/série':t.serie,Référence:t.ref,'Emplacement prévu':t.emp,Quantité:t.qte}))],['Mauvais emplacement',A.wrongPlace.map(w=>({'N° lot/série':w.serie,Référence:w.ref,Prévu:w.attendu,Trouvé:w.trouve}))],['Non attendus',A.unexpected.map(u=>({'N° série':u.val,Référence:u.ref,Zone:u.zone}))])}
  sheets.push(['Comptage',scansOf(sid).map(scanRow)]);
  try{await saveFile(`Analyse_${slug(sessById(sid)?.name||'session')}.xlsx`,await xlsxBlob(sheets))}catch(e){toast(e.message,'bad')}}

const sessLastChange=sid=>S.scans.filter(s=>s.sessionId===sid).reduce((m,s)=>{const t=String(s.editedAt||s.at||'');return t>m?t:m},'');
function supaState(s){const n=scansOf(s.id).length;if(s.archived)return {txt:'Archivée dans Supabase (libérée ici)',cls:'ok'};if(!s.supaAt)return {txt:'Jamais envoyée',cls:'n'};
  return sessLastChange(s.id)>s.supaAt?{txt:'Modifiée depuis le dernier envoi',cls:'warn'}:{txt:'À jour dans Supabase ('+fmtDate(s.supaAt)+')',cls:'ok'}}
function supaCard(){
  const list=S.sessions.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  return `<div class="card"><div class="row between"><h2>Base Supabase</h2><button class="btn sm primary" id="supaAll">Tout envoyer vers Supabase</button></div>

   <div class="tbl-wrap"><table><thead><tr><th>Session</th><th class="num">Scans</th><th>Supabase</th><th></th></tr></thead><tbody>
   ${list.map(s=>{const st=supaState(s);const ok=st.cls==='ok'&&!s.archived;return `<tr><td>${esc(s.name)} ${s.status==='cloturee'?'<span class="pill n">Clôturée</span>':''}</td><td class="num">${s.archived?(s.supaCount??'—'):scansOf(s.id).length}</td><td><span class="pill ${st.cls}">${esc(st.txt)}</span></td>
     <td><div class="row" style="flex-wrap:nowrap">${s.archived?'':`<button class="btn sm" data-sup="${esc(s.id)}">Envoyer</button>`}${ok&&s.status==='cloturee'?`<button class="btn sm danger" data-free="${esc(s.id)}">Libérer</button>`:''}</div></td></tr>`}).join('')||'<tr><td colspan="4" class="muted">Aucune session.</td></tr>'}
   </tbody></table></div><div id="supaMsg" class="small">${esc(S.supaMsg||'')}</div></div>`;
}
const sqlJson=v=>{const t='$invj$';return t+JSON.stringify(v).split(t).join('')+t+'::jsonb'};
const sqlTxt=v=>`(${sqlJson(v==null?'':String(v))}#>>'{}')`;
const readN=r=>{const p=r?.payload??r;const t=typeof p==='string'?p:JSON.stringify(p);return +((t.match(/\\?"n\\?"\s*:\s*(\d+)/)||[])[1])};
async function supaSql(query,ms=45000){const mcp=S.mcp||(S.mcp=await claude.use('mcp'));if(!mcp)throw {code:'no_mcp'};
  const opt=(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?{signal:AbortSignal.timeout(ms)}:undefined;
  return await mcp.callTool(SUPA.server,'execute_sql',{project_id:SUPA.project,query},opt)}
const lost=e=>['cancelled','upstream_error','server_unavailable'].includes(e?.code)||/request failed/i.test(e?.message||'');
// écriture idempotente : si la réponse se perd, on vérifie dans Supabase que les lignes sont bien arrivées
async function supaWrite(query,verifyIds){try{return await supaSql(query)}catch(e){if(!lost(e)||!verifyIds)throw e;
  await new Promise(r=>setTimeout(r,1500));const n=readN(await supaSql(`select count(*)::int as n from inv_comptages where id = any(array(select jsonb_array_elements_text(${sqlJson(verifyIds)}))) and synchro_le > now() - interval '15 minutes';`));
  if(n!==verifyIds.length)throw e}}
function supaErr(e){const m={no_mcp:'Le connecteur Supabase n\'est pas disponible dans cet affichage. Ouvrez l\'application dans claude.ai.',server_not_connected:'Connecteur Supabase absent : ajoutez-le dans claude.ai, Paramètres → Connecteurs.',needs_reauth:'Reconnectez Supabase dans claude.ai, Paramètres → Connecteurs.',not_in_manifest:'L\'accès à Supabase a été refusé pour cette page.',approval_required:'Autorisez l\'application à utiliser Supabase quand Claude le demande.',tool_error:'Supabase a refusé la requête : '+(e?.message||'')};
  return m[e?.code]||('Envoi impossible : '+(e?.message||e?.code||e))}
async function supaSync(ids){
  const msg=t=>{S.supaMsg=t;const e=$('#supaMsg');if(e)e.textContent=t};
  const btns=$$('#supaAll,[data-sup],[data-free]');btns.forEach(b=>b.disabled=true);
  try{
    msg('Envoi des familles et des zones…');
    const fam=S.families.map(f=>({id:f.id,nom:f.name,ordre:f.order??null,champs:f.fields||[],questions:f.questions||[]}));
    const zon=S.zones.map(z=>({id:z.id,nom:z.name,code:z.code||null,description:z.description||null,video_id:z.videoId||null,cree_le:z.at||null,cree_par:z.by||null}));
    await supaSql(`insert into inv_familles (id,nom,ordre,champs,questions) select id,nom,ordre,champs,questions from jsonb_to_recordset(${sqlJson(fam)}) as x(id text,nom text,ordre int,champs jsonb,questions jsonb)
      on conflict (id) do update set nom=excluded.nom,ordre=excluded.ordre,champs=excluded.champs,questions=excluded.questions,synchro_le=now();
      insert into inv_zones (id,nom,code,description,video_id,cree_le,cree_par) select id,nom,code,description,video_id,cree_le,cree_par from jsonb_to_recordset(${sqlJson(zon)}) as x(id text,nom text,code text,description text,video_id text,cree_le timestamptz,cree_par text)
      on conflict (id) do update set nom=excluded.nom,code=excluded.code,description=excluded.description,video_id=excluded.video_id,synchro_le=now();`);
    let done=0;
    for(const sid of ids){const s=sessById(sid);if(!s||s.archived)continue;
      msg(`Envoi de la session « ${s.name} »…`);

    for(let i=0;i<man.length&&!stop;i++){const it=man[i];step(`Photo ${i+1} / ${man.length} : ${it.titre}…`);
      const blob=await (await fetch('demo/gen/'+it.file)).blob();const file=new File([blob],it.file,{type:blob.type||'image/jpeg'});
      const d=await analyse({files:[file],familyId:'auto'});const r=dupCheck(d);
      const res={titre:it.titre,file:it.file,usedAI:d.usedAI,famille:famById(d.familyId).name,codes:(d.codes||[]).map(c=>c.value)};
      if(it.expectBlock){res.type='blocage';res.ok=r.block.length>0;res.detail=r.msgs.map(m=>m.replace(/<[^>]+>/g,'')).join(' ');}

          res.champs.push({k,label:(fam.fields.find(f=>f.key===k)||{}).label||k,attendu:v,lu,ok:!!b&&(a===b||b.includes(a)||(a.length>3&&a.includes(b)&&b.length>=a.length-1))})}

        else{d.note='Test automatique';const before=new Set(S.scans.map(s=>s.id));await saveScan(d,r);for(let k=0;k<50&&S.scans.every(s=>before.has(s.id));k++)await new Promise(r=>setTimeout(r,100))}}

async function enter(session){
  S.uid=session.user.id;S.email=session.user.email;
  const {data:p}=await sb.from('profils').select('*').eq('user_id',S.uid).maybeSingle();
  if(!p||!p.actif){await sb.auth.signOut();return authLogin(p?'Votre compte est désactivé. Contactez l\'administrateur.':'Ce compte n\'a pas d\'accès à l\'inventaire. Contactez l\'administrateur.')}
  S.profil=p;authShow('<div class="row"><div class="spinner"></div><span>Chargement des données…</span></div>');
  try{await SBStore.load()}catch(e){return authLogin('Chargement impossible : '+(e.message||e))}
  S.session=LS.get('session',null);pickDefaultSession();if(S.zone&&!zoneById(S.zone))S.zone=null;
  SBStore.subscribe();$('#auth').classList.add('hidden');render();
}
const sb_onAuth=()=>sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){S.profil=null;for(const k in TBL)S[k]=[];authLogin()}});

/* ---------- mon compte ---------- */
function openMonCompte(){
  openModal(`<div class="sheet-head"><h2>Mon compte</h2><button class="btn ghost" data-close>Fermer</button></div>
   <div class="card"><div><b>${esc(S.profil?.nom||'')}</b> · ${esc(S.email||'')}</div><div class="small muted">Rôle : ${esc(ROLES[role()])}</div></div>
   <div class="card"><h3>Changer mon mot de passe</h3><label class="f">Nouveau mot de passe (8 caractères minimum)<input type="password" id="mcP" autocomplete="new-password" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;color:var(--ink)"></label>
   <div><button class="btn" id="mcB">Enregistrer le mot de passe</button></div></div>
   <div><button class="btn danger" id="mcOut">Se déconnecter</button></div>`);
  $('#mcB').onclick=async()=>{const pw=$('#mcP').value;if(pw.length<8)return toast('8 caractères minimum','bad');const {error}=await sb.auth.updateUser({password:pw});error?toast(error.message,'bad'):(toast('Mot de passe changé'),closeModal())};
  $('#mcOut').onclick=async()=>{closeModal();await sb.auth.signOut()};
}

/* ---------- fenêtre Accès (administrateur) ---------- */
function accesCard(){return `<div class="card"><div class="row between"><h2>Accès</h2><button class="btn sm primary" id="acOpen">Gérer les accès</button></div>
  <p class="small muted">Chaque personne se connecte avec son email et son mot de passe. Vous créez les comptes, choisissez le rôle, désactivez ou changez un mot de passe.</p>
  <div class="small">${(S.profils||[]).filter(p=>p.actif).length} compte(s) actif(s) · ${(S.profils||[]).filter(p=>!p.actif).length} désactivé(s)</div></div>`}
function bindAcces(){$('#acOpen')&&($('#acOpen').onclick=openAcces)}
async function acces(body){const {data,error}=await sb.functions.invoke('gerer-acces',{body});if(error){let j={};try{j=await error.context.json()}catch{}throw new Error(j.error||error.message)}if(data?.error)throw new Error(data.error);return data}
const genPw=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';let s='';const a=new Uint32Array(10);crypto.getRandomValues(a);for(const v of a)s+=c[v%c.length];return s};
async function openAcces(){
  openModal(`<div class="sheet-head"><h2>Accès à l'inventaire</h2><button class="btn ghost" data-close>Fermer</button></div><div id="acBody"><div class="row"><div class="spinner"></div><span>Chargement…</span></div></div>`);
  let comptes=[];try{comptes=(await acces({action:'lister'})).comptes||[]}catch(e){$('#acBody').innerHTML=`<div class="alert bad">${esc(e.message)}</div>`;return}
  const roleSel=(id,r)=>`<select data-acr="${esc(id)}">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${r===k?'selected':''}>${v}</option>`).join('')}</select>`;
  $('#acBody').innerHTML=`<div id="acMsg"></div><div class="card"><h3>Nouveau compte</h3><div class="grid2">
     <label class="f">Nom et prénom<input type="text" id="acN"></label><label class="f">Email<input type="text" id="acE" inputmode="email"></label>
     <label class="f">Mot de passe (à donner à l'agent)<input type="text" id="acP" class="mono" value="${genPw()}"></label><label class="f">Rôle${roleSel('new','compteur').replace('data-acr="new"','id="acR"')}</label></div>
     <div><button class="btn primary" id="acAdd">Créer le compte</button></div></div>
   <div class="tbl-wrap"><table><thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>État</th><th>Dernière connexion</th><th></th></tr></thead><tbody>
   ${comptes.map(c=>`<tr><td>${esc(c.nom)}${c.user_id===S.uid?' <span class="pill n">vous</span>':''}</td><td class="small">${esc(c.email)}</td><td>${roleSel(c.user_id,c.role)}</td>
     <td>${c.actif?'<span class="pill ok">Actif</span>':'<span class="pill bad">Désactivé</span>'}</td><td class="small">${c.derniere_connexion?esc(fmtDate(c.derniere_connexion)):'jamais'}</td>
     <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-acpw="${esc(c.user_id)}">Nouveau mot de passe</button>
     ${c.user_id===S.uid?'':`<button class="btn sm" data-acact="${esc(c.user_id)}" data-v="${c.actif?'0':'1'}">${c.actif?'Désactiver':'Réactiver'}</button><button class="btn sm danger" data-acdel="${esc(c.user_id)}" aria-label="Supprimer">✕</button>`}</div></td></tr>`).join('')}
   </tbody></table></div>
   <p class="small muted">Compteur : scanne. Magasinier et gestionnaire : scannent, corrigent, clôturent, analysent et exportent. Administrateur : tout, plus les familles et les accès.</p>`;
  const done=(t,isErr)=>{$('#acMsg').innerHTML=`<div class="alert ${isErr?'bad':'ok'} small">${esc(t)}</div>`};
  $('#acAdd').onclick=async()=>{const b=$('#acAdd');b.disabled=true;const email=$('#acE').value.trim(),password=$('#acP').value.trim(),nom=$('#acN').value.trim();
    try{await acces({action:'creer',email,password,nom,role:$('#acR').value});await loadProfils();await openAcces();done(`Compte créé pour ${nom||email}. Transmettez-lui : email ${email} · mot de passe ${password}`)}catch(e){b.disabled=false;done(e.message,true)}};
  $$('[data-acr]').forEach(s=>s.onchange=async()=>{try{await acces({action:'modifier',user_id:s.dataset.acr,role:s.value});await loadProfils();done('Rôle mis à jour')}catch(e){done(e.message,true);openAcces()}});
  $$('[data-acact]').forEach(b=>b.onclick=async()=>{try{await acces({action:'modifier',user_id:b.dataset.acact,actif:b.dataset.v==='1'});await loadProfils();await openAcces();done(b.dataset.v==='1'?'Compte réactivé':'Compte désactivé : la personne ne peut plus rien voir ni enregistrer')}catch(e){done(e.message,true)}});
  $$('[data-acpw]').forEach(b=>b.onclick=async()=>{const pw=genPw();if(!(await ask(`Donner le nouveau mot de passe « ${pw} » à ce compte ?`,'Changer')))return;try{await acces({action:'modifier',user_id:b.dataset.acpw,password:pw});done(`Nouveau mot de passe : ${pw} (à transmettre à la personne)`)}catch(e){done(e.message,true)}});
  $$('[data-acdel]').forEach(b=>b.onclick=async()=>{if(!(await ask('Supprimer définitivement ce compte ? Ses comptages restent dans la base.','Supprimer',true)))return;try{await acces({action:'supprimer',user_id:b.dataset.acdel});await loadProfils();await openAcces();done('Compte supprimé')}catch(e){done(e.message,true)}});
}

/* ================= démarrage ================= */
async function init(){
  S.view=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'scan';
  if(!window.supabase){authShow('<div class="alert bad">Impossible de charger l\'application : vérifiez la connexion Internet puis rechargez la page.</div>');return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  S.mode='supabase';S.db=null;S.sample=SBSample;S.aiImages=true;S.assets=SBAssets;S.downloads=SBDownloads;S.names={};
  for(const k in TBL)S[k]=[];
  sb_onAuth();
  await authStart();
}
init();
</script>
